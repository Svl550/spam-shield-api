name: Keep SpamShield API Warm

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping SpamShield Health Endpoint
        run: |
          curl -sf --max-time 35 https://spamshield-api-8kdt.onrender.com/health || echo "Server waking up..."
